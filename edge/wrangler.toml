# Worker « de bordure » de Pécule : se place devant GitHub Pages sur pecule-app.com pour
# ajouter les en-têtes de sécurité HTTP que GitHub Pages ne permet pas de configurer
# (HSTS, anti-iframe, Permissions-Policy...) et les bons en-têtes de cache (un an pour les
# fichiers hachés, revalidation pour les pages et le service worker). Il ne touche pas au contenu.
# Déploiement automatique : .github/workflows/edge.yml. Explications : MAINTENANCE.md § 8.
#
# Les routes ne s'activent QUE si les enregistrements DNS du domaine sont « Proxied »
# (nuage orange) dans Cloudflare. En « DNS only », le Worker est déployé mais jamais appelé :
# le site reste servi directement par GitHub Pages, sans ces en-têtes.
name = "pecule-edge"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Pas d'adresse *.workers.dev : ce Worker n'a de sens que devant le domaine.
workers_dev = false

routes = [
  { pattern = "pecule-app.com/*", zone_name = "pecule-app.com" },
  { pattern = "www.pecule-app.com/*", zone_name = "pecule-app.com" },
]

# Journaux consultables dans le tableau de bord (Workers → pecule-edge → Logs) : seulement les
# lignes écrites par le Worker lui-même (violations de la politique de sécurité reçues sur
# /csp-report : règle, site bloqué, chemin de la page). Les journaux d'appels (une entrée par
# requête, donc l'adresse IP) sont DÉSACTIVÉS, comme sur le serveur de l'application.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
