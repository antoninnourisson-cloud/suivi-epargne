# Mises à jour des dépendances, une fois par mois, regroupées pour limiter le bruit.
# Seules les versions mineures et correctives sont proposées automatiquement : une version
# majeure demande souvent des changements de code et se fait à la main (voir MAINTENANCE.md).
# Les correctifs de sécurité restent proposés quelle que soit la version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      app-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      worker-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
