name: Bug
description: Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "N'indiquez aucune donnée réelle (montants, documents) : utilisez si possible le mode démo. Pour une faille de sécurité, suivez plutôt [SECURITY.md](https://github.com/antoninnourisson-cloud/suivi-epargne/blob/main/SECURITY.md). Une question ? contact@pecule-app.com. Les échanges suivent le [code de conduite](https://github.com/antoninnourisson-cloud/suivi-epargne/blob/main/CODE_OF_CONDUCT.md)."
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
      description: Ce que vous avez fait, ce que vous attendiez, ce qui s'est passé.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pour reproduire
      placeholder: "1. Ouvrir…\n2. Cliquer sur…"
  - type: input
    id: version
    attributes:
      label: Version
      description: "Affichée en bas du menu et dans l'historique des mises à jour des Paramètres (ex. 2026.10.08)"
  - type: input
    id: device
    attributes:
      label: Appareil et navigateur
      placeholder: "ex. iPhone 15, app installée ; Windows 11, Chrome"
