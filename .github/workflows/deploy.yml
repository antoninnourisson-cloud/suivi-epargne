name: Déploiement

# checks (ci.yml) → [site : build → deploy] + [serveur] + [en-têtes edge] → release.
# Une seule vérification par push, puis les TROIS parties partent ensemble à chaque push sur
# main : l'app et le serveur ne peuvent plus rester désaccordés. (Jusqu'au 26/10/2026, le
# serveur et edge/ avaient leurs propres workflows filtrés par chemins : un déploiement raté
# n'était jamais refait tant qu'aucun de leurs fichiers ne changeait, et l'app du lot 3 a
# tourné trois jours face à l'ancien serveur.) Redéployer un Worker inchangé est sans effet.
# Le site publie le dossier `dist` construit ET testé par ci.yml dans cette même exécution
# (artefact site-dist) : rien n'est reconstruit entre le test et la mise en ligne. Après un
# déploiement réussi, la version en tête de src/changelog.ts est publiée comme tag + GitHub
# Release (une fois).
# Retour arrière sans terminal : Actions → Déploiement → Run workflow, champ « Version à
# publier » = un tag (v2026.10.23-4) ou un commit. Ce commit est revérifié par ci.yml puis
# publié partout (site + serveur + en-têtes) ; aucun tag ni Release n'est créé. Le push
# suivant sur main republie main. Procédure : MAINTENANCE.md § 5.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Version à publier : main, un tag (ex. v2026.10.23-4) ou un commit'
        type: string
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: pages
  # Ne jamais interrompre un déploiement Pages en cours (recommandation GitHub) : le
  # suivant attend son tour.
  cancel-in-progress: false

jobs:
  checks:
    name: Vérifications
    uses: ./.github/workflows/ci.yml
    with:
      # Vide sur un push : le commit poussé.
      ref: ${{ inputs.ref }}

  cloudflare:
    name: Secrets Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ok: ${{ steps.secrets.outputs.ok }}
    steps:
      - name: Secrets Cloudflare présents ?
        id: secrets
        # `secrets` est interdit dans le `if` d'un job : on passe par une variable
        # d'environnement d'étape, exposée en sortie du job.
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "ok=${HAS_TOKEN}" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : déploiement des Workers sauté (npm run deploy dans worker/ et edge/)."
          fi

  worker:
    name: Déploiement du serveur
    needs: [checks, cloudflare]
    if: ${{ needs.cloudflare.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: worker
      cancel-in-progress: false
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Le commit exact vérifié par ci.yml (celui d'un retour arrière, sinon le push).
          ref: ${{ needs.checks.outputs.sha }}
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Installation de wrangler (version du lockfile)
        run: npm ci --prefix worker

      - name: Déploiement
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          workingDirectory: worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message "${{ needs.checks.outputs.sha }}"

  edge:
    name: Déploiement des en-têtes de sécurité
    needs: [checks, cloudflare]
    if: ${{ needs.cloudflare.outputs.ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: edge
      cancel-in-progress: false
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Le commit exact vérifié par ci.yml (celui d'un retour arrière, sinon le push).
          ref: ${{ needs.checks.outputs.sha }}
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: edge/package-lock.json

      - name: Installation de wrangler (version du lockfile)
        run: npm ci --prefix edge

      - name: Déploiement
        # Le jeton doit avoir, en plus des droits du Worker serveur :
        # Zone → Workers Routes → Edit (et Zone → Zone → Read) sur pecule-app.com.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          workingDirectory: edge
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message "${{ needs.checks.outputs.sha }}"

  build:
    name: Build vérifié
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupération du build vérifié par ci.yml
        # Le dossier `dist` de l'étape « Build de production » de ci.yml (même commit, même
        # GITHUB_SHA lu par vite.config.ts), déjà passé par e2e/production.spec.ts.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: dist

      - name: Préparation de l'artifact Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  release:
    name: Release
    # Après le site ET les deux Workers (sautés sans secrets Cloudflare : la Release part quand même).
    # Jamais pour un retour arrière (Run workflow avec une autre version que main) : le tag
    # en tête du changelog de main désignerait alors un commit qui n'est pas celui publié.
    needs: [deploy, worker, edge]
    if: ${{ always() && (github.event_name == 'push' || inputs.ref == 'main') && needs.deploy.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.worker.result) && contains(fromJSON('["success", "skipped"]'), needs.edge.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Lecture de la dernière version du changelog
        id: changelog
        # Version = première occurrence de version: '...' dans le fichier (l'entrée en tête).
        # Les puces viennent du vrai tableau CHANGELOG : Node 22 retire les types TypeScript
        # à la volée, ce qui évite de parser des chaînes JS (apostrophes, guillemets) à la main.
        run: |
          VERSION=$(grep -m1 -oP "version:\s*'\K[^']+" src/changelog.ts)
          if [ -z "$VERSION" ]; then echo "::error::Aucune version trouvée dans src/changelog.ts"; exit 1; fi
          export VERSION
          node --experimental-strip-types --no-warnings -e '
            import("./src/changelog.ts").then(({ CHANGELOG }) => {
              const fs = require("fs");
              const e = CHANGELOG.find(x => x.version === process.env.VERSION);
              if (!e) { console.error("Entrée " + process.env.VERSION + " introuvable"); process.exit(1); }
              fs.writeFileSync("release-notes.md", e.items.map(i => "- " + i).join("\n") + "\n");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + e.version + "\ntitle=" + e.title + "\n");
            });
          '
          cat release-notes.md

      - name: Tag et GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.changelog.outputs.version }}
          TITLE: ${{ steps.changelog.outputs.title }}
        run: |
          tag="v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --silent 2>/dev/null; then
            echo "Le tag ${tag} existe déjà : rien à publier."
            exit 0
          fi
          # gh crée le tag sur le commit déployé, puis la Release avec les notes du changelog.
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION} · ${TITLE}" \
            --notes-file release-notes.md
