name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation des dépendances
        # npm ci : installation exacte d'après package-lock.json (reproductible).
        run: npm ci

      # Garde-fous : un déploiement ne part jamais si les calculs (fiscalité, quinzaines,
      # chiffrement des notifications...) ou le typage sont cassés.
      - name: Tests
        run: npm test

      - name: Vérification des types (app)
        run: npx tsc --noEmit

      - name: Build de production
        run: npm run build

      - name: Préparation de l'artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
