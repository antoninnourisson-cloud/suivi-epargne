name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - uses: android-actions/setup-android@v3
      
      - name: Install and Build Web
        run: |
          npm install
          npm run build
          
      - name: Generate and Build Android
        run: |
          npx cap init "Suivi Epargne" com.suiviepargne.app --web-dir dist
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-epargne-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk