name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - uses: android-actions/setup-android@v3
      
      # ETAPE CORRIGÉE : On force la correction du package.json à la volée
      - name: Force Version Fix and Install
        run: |
          # Cette commande remplace le mot "latest" par "^6.0.0" directement dans le fichier
          sed -i 's/"latest"/"^6.0.0"/g' package.json
          
          # On affiche le contenu du fichier dans les logs pour vérifier (si ça plante encore)
          cat package.json
          
          # On installe
          npm install
          
      - name: Build Web App
        run: npm run build
          
      - name: Generate and Build Android
        run: |
          npx cap init "Suivi Epargne" com.suiviepargne.app --web-dir dist
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-epargne-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk