name: Déploiement des en-têtes de sécurité (Worker edge)

# Déploie edge/ (Worker « pecule-edge », routes pecule-app.com/* et www.pecule-app.com/*),
# qui ajoute les en-têtes de sécurité devant GitHub Pages. Voir MAINTENANCE.md § 8.
# Les routes s'attachent à la zone Cloudflare même si les enregistrements DNS sont encore en
# « DNS only » : le déploiement réussit, le Worker ne sert simplement qu'une fois le DNS
# passé en « Proxied ». Sans les secrets CLOUDFLARE_*, le déploiement est sauté.
on:
  push:
    branches: [main]
    paths:
      - 'edge/**'
      - '.github/workflows/edge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge
  cancel-in-progress: false

jobs:
  checks:
    name: Types et tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cloudflare: ${{ steps.secrets.outputs.cloudflare }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            edge/package-lock.json

      - name: Installation des dépendances
        # Les tests d'edge/ tournent avec le Vitest de la racine (comme ceux du serveur).
        run: |
          npm ci
          npm ci --prefix edge

      - name: Vérification des types
        run: npx tsc --noEmit -p edge

      - name: Tests
        run: npx vitest run edge/

      - name: Secrets Cloudflare présents ?
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "cloudflare=${HAS_TOKEN}" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : déploiement du Worker edge sauté."
          fi

  deploy:
    name: Déploiement Cloudflare
    needs: checks
    if: ${{ needs.checks.outputs.cloudflare == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: edge/package-lock.json

      - name: Installation de wrangler (version du lockfile)
        run: npm ci --prefix edge

      - name: Déploiement
        # Le jeton doit avoir, en plus des droits du Worker serveur :
        # Zone → Workers Routes → Edit (et Zone → Zone → Read) sur pecule-app.com.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          workingDirectory: edge
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message "${{ github.sha }}"
