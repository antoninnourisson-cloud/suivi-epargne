name: Vérifications

# Garde-fous de l'app ET du serveur : types, tests, build, audit des dépendances.
# - sur chaque pull request et chaque push sur main ;
# - chaque lundi à 6 h UTC : une partie de la logique dépend de la date du jour (quinzaines,
#   révisions de taux, restitution, échéances), et de nouvelles failles peuvent être publiées
#   sans que le code change ;
# - appelé par deploy.yml (workflow_call) : un déploiement ne part jamais si ces vérifications
#   échouent, et il publie le dossier `dist` construit et testé ici (artefact site-dist).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Quand ce workflow est appelé par deploy.yml, github.workflow est le nom de l'appelant :
  # le préfixe « ci- » évite toute collision avec le groupe « pages » du déploiement.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            edge/package-lock.json

      - name: Installation des dépendances (app)
        # npm ci : installation exacte d'après package-lock.json (reproductible).
        run: npm ci

      - name: Installation des dépendances (serveur)
        # Nécessaire à la vérification des types du Worker (@cloudflare/workers-types).
        run: npm ci --prefix worker

      - name: Installation des dépendances (en-têtes de sécurité, edge/)
        run: npm ci --prefix edge

      - name: Lint (ESLint)
        run: npm run lint

      - name: Vérification des types (app + serveur + edge)
        run: npm run typecheck

      - name: Tests (app + serveur + edge) et couverture
        # Échoue si la couverture passe sous les seuils de vitest.config.ts : ceux de toute
        # l'app (hooks, services, écrans) et ceux, plus exigeants, du cœur métier (src/lib,
        # worker/src, edge/src).
        run: npm run test:coverage

      - name: Tests de bout en bout (build de production)
        # En CI, Playwright construit le build de production (dist-e2e : mêmes réglages que le
        # build publié, CSP et service worker compris, mode démo en plus) et le sert avec
        # `vite preview` ; voir playwright.config.ts et e2e/target.ts. Les parcours de
        # synchronisation tournent contre un faux Drive, sans aucun appel à Google ni au serveur.
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Build de production
        # Le build publié : deploy.yml reprend CE dossier (artefact site-dist ci-dessous) au lieu
        # de reconstruire. Ce qui part en ligne est donc exactement ce qui est testé ici.
        run: npm run build

      - name: Test du build publié (dossier dist exact)
        # Le parcours sans démo d'e2e/production.spec.ts, contre le dossier qui sera publié :
        # l'app démarre, aucune violation CSP ni fichier manquant, le service worker s'installe
        # et sert l'app hors ligne. Servi tel quel par `vite preview` (voir e2e/target.ts).
        env:
          E2E_DIST: dist
        run: npx playwright test e2e/production.spec.ts

      - name: Rapport des tests de bout en bout
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Taille du build
        run: |
          kb() { awk -v b="$1" 'BEGIN { printf "%.1f", b / 1024 }'; }
          {
            echo '### Taille du build (`dist/assets`)'
            echo
            echo '| Fichier | Taille | gzip |'
            echo '|---|---:|---:|'
            for f in $(ls -S dist/assets); do
              p="dist/assets/$f"
              raw=$(stat -c %s "$p")
              gz=$(gzip -9 -c "$p" | wc -c)
              echo "| \`$f\` | $(kb "$raw") Ko | $(kb "$gz") Ko |"
            done
            echo
            echo "Total \`dist/\` : $(du -sk dist | cut -f1) Ko"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefact du build vérifié
        # Repris tel quel par deploy.yml dans la même exécution. `.nojekyll` est un fichier
        # caché : include-hidden-files le garde, pour publier le dossier à l'identique.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Audit des dépendances (app et serveur, outils de développement compris)
        # Informatif : une faille publiée dans une dépendance ne doit pas bloquer un
        # déploiement urgent. Le résultat reste visible (étape en orange dans le journal).
        # Les outils de développement sont audités aussi : une faille de Vitest ou de Vite
        # peut exposer les fichiers du poste de développement.
        continue-on-error: true
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix worker --audit-level=moderate
          npm audit --prefix edge --audit-level=moderate
