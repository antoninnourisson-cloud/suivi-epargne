name: Déploiement du serveur (Worker)

# Déploie le Worker Cloudflare quand son code change, ou celui qu'il partage avec l'app
# (src/lib, types, constantes : le Worker les importe pour lire le fichier Drive et calculer
# les rappels). Tant que le secret CLOUDFLARE_API_TOKEN n'existe pas dans le dépôt, le job
# de déploiement est simplement sauté (« skipped ») : rien n'échoue.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/lib/**'
      - 'src/types.ts'
      - 'src/constants.ts'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  checks:
    name: Types et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cloudflare: ${{ steps.secrets.outputs.cloudflare }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            edge/package-lock.json

      - name: Installation des dépendances
        # edge/ : `npm run typecheck` vérifie aussi le Worker des en-têtes de sécurité.
        run: |
          npm ci
          npm ci --prefix worker
          npm ci --prefix edge

      - name: Vérification des types (app + serveur)
        run: npm run typecheck

      - name: Tests (app + serveur)
        run: npm test

      - name: Secrets Cloudflare présents ?
        id: secrets
        # `secrets` est interdit dans le `if` d'un job : on passe par une variable
        # d'environnement d'étape, exposée en sortie du job.
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          echo "cloudflare=${HAS_TOKEN}" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : déploiement du Worker sauté."
          fi

  deploy:
    name: Déploiement Cloudflare
    needs: checks
    if: ${{ needs.checks.outputs.cloudflare == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installation de Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Installation de wrangler (version du lockfile)
        run: npm ci --prefix worker

      - name: Déploiement
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          workingDirectory: worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message "${{ github.sha }}"
