name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupération du code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Installation Java (Requis pour Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Installation Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. Installation des dépendances du projet
      - name: Install Dependencies
        run: npm install

      # 5. Construction de l'app Web (Vite -> dist/)
      - name: Build Web App
        run: npm run build

      # 6. Ajout du moteur Android (puisque tu ne l'as pas sur GitHub)
      - name: Add Android Platform
        run: npx cap add android

      # 7. Synchronisation (Copie du dossier dist/ vers android/)
      - name: Sync Capacitor
        run: npx cap sync

      # 8. Permission Exécution Gradle (Crucial)
      # On utilise working-directory pour être sûr d'être au bon endroit
      - name: Make Gradlew Executable
        working-directory: ./android
        run: chmod +x gradlew

      # 9. Compilation de l'APK
      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      # 10. Sauvegarde du fichier pour téléchargement
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suivi-epargne-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk