# Serveur de Pécule (session persistante + notifications push).
# Guide complet : worker/README.md
# Le nom technique `suivi-epargne-api` (ancien nom de l'app) est conservé : le changer créerait
# un autre Worker, à une autre adresse (redirection OAuth, VITE_BACKEND_URL, sessions...).
# Déploiement automatique : .github/workflows/worker.yml (dès que les secrets GitHub existent).
name = "suivi-epargne-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Adresse publique : https://api.pecule-app.com, « domaine personnalisé » ajouté dans le
# tableau de bord (Workers & Pages → suivi-epargne-api → Settings → Domains & Routes), pour que
# la règle de limitation de débit de la zone pecule-app.com s'applique AVANT le Worker
# (MAINTENANCE.md § 6). Volontairement AUCUNE ligne `routes` ici : sans elle, `wrangler deploy`
# ne touche pas aux domaines du Worker (vérifié dans le code de wrangler 4.148) ; avec
# `custom_domain = true`, il les remplacerait et exigerait des droits DNS que le jeton du
# déploiement automatique n'a pas forcément.
# L'ancienne adresse *.workers.dev reste ouverte pendant la transition (apps installées pas
# encore à jour, connexions en cours) ; à fermer ensuite par `workers_dev = false` (ROADMAP.md).

[vars]
# Client OAuth : DOIT être le même que celui de l'app (src/services/googleDriveService.ts),
# sinon le scope drive.file ne donne pas accès au fichier de données déjà créé.
GOOGLE_CLIENT_ID = "763862877733-hl1an9vcn0ibnoq2iq035927528mimd5.apps.googleusercontent.com"
APP_URL = "https://pecule-app.com/"
# Ancienne adresse (avant octobre 2026), acceptée le temps que les apps installées depuis
# github.io déménagent (écran « Pécule a déménagé »). À retirer début 2027.
LEGACY_APP_URL = "https://antoninnourisson-cloud.github.io/suivi-epargne/"
# Contact exigé par le protocole VAPID. Une URL https est acceptée (RFC 8292) : évite de
# publier une adresse e-mail dans ce fichier, visible dans le dépôt.
VAPID_SUBJECT = "https://pecule-app.com/"
# Pas d'EXTRA_ORIGINS en production : localhost n'est autorisé qu'en local, par `npm run dev`
# (= wrangler dev --var EXTRA_ORIGINS:http://localhost:5173, voir package.json).

# Secrets (jamais dans ce fichier) — posés par `npm run setup-secrets` et `wrangler secret put` :
#   GOOGLE_CLIENT_SECRET, ENCRYPTION_KEY, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, ALLOWED_EMAILS

[[kv_namespaces]]
binding = "STORE"
id = "4fc93d52562e4d78a88691e38753518c"

# Limitation de débit par IP (binding natif, sans écriture KV). namespace_id est un entier
# libre, propre au compte : rien à créer dans le tableau de bord. period = 10 ou 60 s.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "7301"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "7302"
simple = { limit = 60, period = 60 }

# Journaux consultables dans le tableau de bord (Workers → suivi-epargne-api → Logs) : seulement
# les messages écrits par le serveur lui-même (console.error : échecs, sans adresse IP, sans
# jeton ni donnée). Les journaux d'appels (une entrée par requête, avec ses en-têtes, donc
# l'adresse IP) sont DÉSACTIVÉS, comme l'annonce la page de confidentialité :
# https://developers.cloudflare.com/workers/observability/logs/workers-logs/
[observability]
enabled = true

[observability.logs]
invocation_logs = false

# Workers AI (veille fiscale hebdomadaire, src/fiscalWatchJob.ts). Offre gratuite : 10 000
# neurones par jour ; une exécution en consomme moins de 6 000 (plafond codé), en pratique
# autour de 2 000. Rien à créer dans le tableau de bord.
[ai]
binding = "AI"

# Deux tâches planifiées, distinguées par event.cron dans src/index.ts (scheduled) :
#   "0 7 * * *" rappels quotidiens : 07:00 UTC = 9 h à Paris en été, 8 h en hiver ;
#   "0 5 * * 1" veille fiscale, le lundi à 05:00 UTC (FISCAL_WATCH_CRON, à garder identique).
[triggers]
crons = ["0 7 * * *", "0 5 * * 1"]
