<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP : seule défense possible sur GitHub Pages (pas d'en-têtes serveur configurables).
      L'app stocke un token OAuth Drive+Gmail en localStorage : limiter les origines de
      scripts/connexions réduit drastiquement ce qu'un script injecté pourrait exfiltrer.
      'unsafe-inline' (script) est requis par le SDK Google Identity Services ;
      'unsafe-inline' (style) par GIS, le Picker et Tailwind en dev.
      frame-src couvre la popup GIS et l'iframe du Google Picker.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com;
      connect-src 'self' ws://localhost:5173 ws://127.0.0.1:5173 https://www.googleapis.com https://content.googleapis.com https://accounts.google.com https://oauth2.googleapis.com https://gmail.googleapis.com https://generativelanguage.googleapis.com;
      img-src 'self' data: https://*.googleusercontent.com https://ssl.gstatic.com https://www.gstatic.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com;
      font-src 'self' https://fonts.gstatic.com;
      frame-src https://accounts.google.com https://content.googleapis.com https://docs.google.com;
      worker-src 'self';
      base-uri 'self';
      form-action 'self' https://accounts.google.com;
    ">
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Suivi d'épargne personnel — données stockées sur votre propre Google Drive." />
    <meta name="theme-color" content="#0f172a" />
    <title>Suivi Épargne</title>
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- preconnect : la feuille de style des polices bloque le rendu, autant ouvrir la
         connexion vers l'hôte des fichiers de police en parallèle. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Cette application nécessite JavaScript.</noscript>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
