<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      CSP : seule défense possible sur GitHub Pages (pas d'en-têtes serveur configurables).
      L'app stocke un token OAuth Drive en localStorage : limiter les origines de
      scripts/connexions réduit drastiquement ce qu'un script injecté pourrait exfiltrer.
      Aucun script intégré n'est autorisé (la page n'en contient pas) ; 'unsafe-inline'
      (style) reste nécessaire à GIS, au Picker et aux styles en ligne de React.
      frame-src couvre la popup GIS et l'iframe du Google Picker.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://accounts.google.com https://apis.google.com;
      connect-src 'self' __BACKEND_ORIGIN__ ws://localhost:5173 ws://127.0.0.1:5173 https://www.googleapis.com https://content.googleapis.com https://accounts.google.com https://oauth2.googleapis.com https://generativelanguage.googleapis.com;
      img-src 'self' data: https://*.googleusercontent.com https://ssl.gstatic.com https://www.gstatic.com;
      style-src 'self' 'unsafe-inline' https://accounts.google.com;
      font-src 'self';
      frame-src https://accounts.google.com https://content.googleapis.com https://docs.google.com;
      worker-src 'self';
      base-uri 'self';
      form-action 'self' https://accounts.google.com;
    ">
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="Pécule : faites pousser votre épargne. Données stockées sur votre propre Google Drive." />
    <meta name="theme-color" content="#14532d" />
    <title>Pécule</title>
    <link rel="icon" type="image/png" href="pwa-192x192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Pécule" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Cette application nécessite JavaScript.</noscript>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
